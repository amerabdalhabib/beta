<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amer.News</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-left">
            <span class="brand-icon">📰</span>
            <h1 class="brand-name">Amer.News</h1>
        </div>
        <div class="header-right">
            <input type="text" id="search-input" placeholder="Search news..." />
            <button id="theme-toggle" class="icon-btn">🌙</button>
            <button class="account-btn" onclick="toggleModal('login-modal')">Account</button>
        </div>
    </header>

    <main class="main-container">
        <div class="date-header" id="current-date"></div>
        
        <div class="view-toggles">
            <button class="seg-btn" data-view="grid-1">1 Col</button>
            <button class="seg-btn" data-view="grid-2">2 Col</button>
            <button class="seg-btn" data-view="grid-3">3 Col</button>
            <button class="seg-btn" data-view="grid-4">4 Col</button>
            <button class="seg-btn" data-view="list">List</button>
            <button class="seg-btn" data-view="text">Text</button>
        </div>

        <div id="news-feed" class="news-grid"></div>

        <div class="load-more-container">
            <button id="load-more-btn" style="display: none;">Load More</button>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; Amer.News. Built with Supabase & GitHub Pages.</p>
    </footer>

    <div id="login-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Account Settings</h3>
            <p>Manage your preferences and saved bookmarks.</p>
            <button onclick="toggleModal('login-modal')">Close</button>
        </div>
    </div>

    <button id="back-to-top" style="display: none;" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

    <script src="app.js"></script>
</body>
</html>
